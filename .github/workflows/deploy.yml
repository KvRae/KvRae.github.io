# A simple workflow to build and deploy a Vite React project to GitHub Pages

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - react-v2 # This is the crucial change, it listens for pushes to the 'react-v2' branch

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # This must match your Vite build output folder, which is 'dist' by default

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
